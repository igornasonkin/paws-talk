<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Paws Score</title>
<meta name="theme-color" content="#5b0a3c">
<link rel="icon" href="s-cflwf002.png" type="image/png">
<link rel="apple-touch-icon" href="s-cflwf002.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paws Score">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#fdf8ec;--card:#ffffff;--ink:#2a1020;--muted:#6b5560;--line:#e6d9c6;--plum:#5b0a3c;--s1:#5b0a3c;--s2:#2a78d6;--good:#1f7a3a;--warn:#9a5b00;--chip:#f2e8d4;--on-plum:#fdf8ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1016;--card:#26171f;--ink:#f6ecf1;--muted:#c8b4be;--line:#41303a;--plum:#e9a5cc;--s1:#e07db5;--s2:#3987e5;--good:#5fd07f;--warn:#f0b24f;--chip:#34232d;--on-plum:#2a1020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1016;--card:#26171f;--ink:#f6ecf1;--muted:#c8b4be;--line:#41303a;--plum:#e9a5cc;--s1:#e07db5;--s2:#3987e5;--good:#5fd07f;--warn:#f0b24f;--chip:#34232d;--on-plum:#2a1020;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(14px,env(safe-area-inset-top,0px)) max(30px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto}
h1{font:700 26px/1.2 Georgia,"Times New Roman",serif;margin:6px 0 2px;color:var(--plum)}
h2{font:700 20px/1.25 Georgia,"Times New Roman",serif;margin:0 0 8px}
.sub{color:var(--muted);font-size:15px;margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin:0 -4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
button,.chip{font:inherit;color:var(--ink);background:var(--chip);border:2px solid transparent;border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer;white-space:nowrap}
button[aria-pressed="true"],button.on{background:var(--plum);color:var(--on-plum);font-weight:700}
button.solid{background:var(--plum);color:var(--on-plum);font-weight:700;border-radius:12px}
button:focus-visible,summary:focus-visible{outline:3px solid var(--s2);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.stat .n{font:700 34px/1.1 Georgia,"Times New Roman",serif;color:var(--ink)}
.stat .l{font-size:15px;color:var(--muted)}
.stat .d{font-size:14px;margin-top:2px}
.up{color:var(--good)}.down{color:var(--warn)}.flat{color:var(--muted)}
.bars .r{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:16px}
.bars .t{height:16px;background:var(--chip);border-radius:4px;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.bars .v{font-variant-numeric:tabular-nums;font-weight:700}
.split{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px;margin:6px 0}
.split i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.legend b{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
details{margin-top:8px;font-size:15px}
summary{cursor:pointer;color:var(--muted);min-height:32px}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--muted);font:12px -apple-system,Helvetica,Arial,sans-serif}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:15px;z-index:9;display:none;max-width:70vw}
.note{font-size:15px;color:var(--muted)}
.wren{font:19px/1.55 Georgia,"Times New Roman",serif}
.wren p{margin:0 0 12px}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink);margin-right:6px}
.msg{padding:14px;border-radius:12px;background:var(--chip);margin:10px 0}
.toggle{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle .tx{min-width:0}.toggle b{display:block}
.toggle .tx span{font-size:15px;color:var(--muted)}
.toggle .nn{font:700 22px/1 Georgia,serif;white-space:nowrap;padding-top:2px}
.logs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);min-height:70px}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Paws Score</h1>
  <p class="sub" id="stamp">Private. For two people only.</p>
  <div class="row" id="ranges" role="group" aria-label="Time range">
    <button data-r="7" aria-pressed="false">7 days</button><button data-r="28" aria-pressed="true">28 days</button><button data-r="90" aria-pressed="false">90 days</button>
    <button id="refresh" aria-label="Refresh numbers">Refresh</button>
  </div>
  <div class="tabs" id="tabs" role="tablist">
    <button data-t="home" class="on">Overview</button><button data-t="wren">Inspector Wren</button><button data-t="src">Where from</button><button data-t="listen">Listening</button><button data-t="eps">Episodes</button><button data-t="track">What we track</button><button data-t="log">Log</button>
  </div>
  <div id="view"><div class="msg">Loading your numbers…</div></div>
  <p class="note" style="margin-top:22px">Counts are anonymous. Your own phones are left out once you tap the show title three times on each. Success stays private: never share these screens.</p>
</div>
<div class="tip" id="tip" role="status"></div>
<script>
(function(){
'use strict';
var API='https://www.irvinedogboarding.net/_functions/';
var LS=null;try{LS=window.localStorage}catch(e){}
function g(k){try{return LS?LS.getItem(k):null}catch(e){return null}}
function s(k,v){try{if(LS)LS.setItem(k,v)}catch(e){}}
var K=(location.hash.match(/k=([A-Za-z0-9]+)/)||[])[1]||g('sb_k')||'';
if(K)s('sb_k',K);
var $=function(i){return document.getElementById(i)};
var R=+g('sb_r')||28, TAB=g('sb_t')||'home', EV=[], EPS=[], NOW=Date.now(), LOADED=0;

/* ---------- names ---------- */
var SRCN={direct:'Direct (typed, bookmark, app)',site:'Our website','qr-front':'QR card: front window','qr-paper':'QR card: paper','qr-card':'QR card: handed out',share:'A friend shared it',feed:'Podcast app / feed','ig-bio':'Instagram bio','ig-story':'Instagram story','ig-post':'Instagram post','fb-group':'Facebook group',nextdoor:'Nextdoor',gmb:'Google profile','wix-blog':'Website blog',owner:'You (logged)'};
function sn(x){return SRCN[x]||x}
var REFN={none:'None / direct',ig:'Instagram',fb:'Facebook',nd:'Nextdoor',goog:'Google',bing:'Bing',site:'Our website',x:'X / Twitter',self:'Our own pages',other:'Other site'};
var DEVN={ios:'iPhone / iPad',and:'Android',desk:'Computer'};

/* ---------- dates (Pacific) ---------- */
function ptDay(ts){var p={};new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(ts)).forEach(function(x){p[x.type]=x.value});return p.year+'-'+p.month+'-'+p.day}
function addDays(ds,n){var a=ds.split('-');var t=Date.UTC(+a[0],+a[1]-1,+a[2])+n*86400000;return new Date(t).toISOString().slice(0,10)}
function dayList(endDs,n){var o=[];for(var i=n-1;i>=0;i--)o.push(addDays(endDs,-i));return o}
function short(ds){var a=ds.split('-');return new Date(Date.UTC(+a[0],+a[1]-1,+a[2],12)).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})}
function long(ds){var a=ds.split('-');return new Date(Date.UTC(+a[0],+a[1]-1,+a[2],12)).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'})}
function today(){return ptDay(NOW)}

/* ---------- metrics ---------- */
var is=function(t){return function(e){return e.t===t}};
var M={
 visits:{n:'Page visits',d:'Times someone opened the podcast page. One count per visit.',f:is('pv')},
 qr:{n:'QR landings',d:'Visits that began from one of our QR cards.',f:function(e){return e.t==='pv'&&/^qr-/.test(e.s)}},
 sharedv:{n:'Visits from shared links',d:'Visits that began from the Share button of a friend.',f:function(e){return e.t==='pv'&&e.s==='share'}},
 plays:{n:'Plays started',d:'Someone pressed play (once per episode per visit).',f:is('ps')},
 p60:{n:'Listened 60 seconds or more',d:'Really listened for a minute. The most honest sign of interest.',f:is('p60')},
 p50:{n:'Listened half',d:'Listened to at least half of an episode (real listening, not skipping).',f:is('p50')},
 fin:{n:'Finished an episode',d:'Listened to most of an episode and reached the end.',f:is('p100')},
 shares:{n:'Share taps',d:'Someone tapped "Share this show with a friend".',f:is('sh')},
 site:{n:'Clicks to our website',d:'Someone went from the podcast to irvinedogboarding.net.',f:is('wc')},
 suggest:{n:'Suggest-a-voice clicks',d:'Someone opened the "Suggest a voice or topic" page.',f:is('sv')},
 studio:{n:'Studio opens',d:'Someone opened the Studio (seat the table, pick a topic).',f:is('st')},
 feed:{n:'Podcast feed clicks',d:'Someone tapped the podcast feed link.',f:is('fd')},
 srcseen:{n:'Research section seen',d:'The "research behind this episode" section came into view.',f:is('so')},
 studies:{n:'Study links opened',d:'Someone opened a real study link.',f:is('sl')},
 tr:{n:'Read-along used',d:'Someone tapped a line of the transcript.',f:is('tr')},
 speed:{n:'Speed changes',d:'Someone changed the playback speed.',f:is('sp')},
 seek:{n:'Skips and scrubs',d:'Someone used back 15 seconds or dragged the bar.',f:is('sk')},
 deep:{n:'Scrolled to the bottom',d:'Reached the bottom of the page.',f:function(e){return e.t==='sd'&&e.x===100}},
 ins:{n:'Added to home screen (Android, computer)',d:'The browser reported an install. iPhone does not report this; see "App opens".',f:is('ins')},
 app:{n:'App opens',d:'Visits from the home-screen app rather than the browser.',f:function(e){return e.t==='pv'&&e.m==='app'}},
 mg:{n:'Meet & Greet requests (you log them)',d:'Requests you logged on the Log tab, by where they heard of us.',f:function(e){return e.t==='man'&&/^mg-/.test(e.g)}},
 cards:{n:'Cards handed out (you log them)',d:'QR cards you handed out or left. Used to compute landings per 10 cards.',f:function(e){return e.t==='man'&&e.g==='cards-out'}}
};
var CARDS=['visits','plays','p60','shares','site','mg'];

/* ---------- data ---------- */
function parse(list){var o=[];for(var i=0;i<list.length;i++){try{var e=JSON.parse(list[i][1]);e.ts=list[i][0];if(e.s==='testrun'||e.v==='testrun0001')continue;o.push(e)}catch(x){}}return o}
function load(){
  if(!K){$('view').innerHTML='<div class="msg"><b>This page needs your private link.</b><br>Open the link Igor was sent once. After that this page remembers it on this phone.</div>';return Promise.resolve()}
  $('stamp').textContent='Updating…';
  var p1=fetch(API+'r',{method:'POST',body:JSON.stringify({k:K,days:100})}).then(function(r){if(r.status===403)throw new Error('key');return r.json()});
  var p2=fetch('episodes.json?'+Date.now()).then(function(r){return r.json()}).then(function(d){EPS=d.episodes||[]}).catch(function(){});
  return Promise.all([p1,p2]).then(function(a){var d=a[0];if(!d.ok)throw new Error('server');EV=parse(d.ev);NOW=d.now||Date.now();LOADED=Date.now();try{s('sb_cache',JSON.stringify({ev:d.ev,now:NOW}))}catch(e){}stamp();render()}).catch(function(err){
    var c=null;try{c=JSON.parse(g('sb_cache')||'null')}catch(e){}
    if(c){EV=parse(c.ev);NOW=c.now;stamp('Offline: showing the last saved numbers. ');render()}
    else $('view').innerHTML='<div class="msg">'+(err.message==='key'?'The key was not accepted. Ask Igor for a fresh private link.':'Could not reach the counters. Try Refresh in a minute.')+'</div>';
  });
}
function stamp(pre){$('stamp').textContent=(pre||'')+'Updated '+new Date(LOADED||NOW).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+'. Private, for two people only.'}

function inRange(ds,a,b){return ds>=a&&ds<=b}
function count(f,a,b){var n=0;for(var i=0;i<EV.length;i++){var e=EV[i];if(inRange(e.dt,a,b)&&f(e))n++}return n}
function uniq(f,a,b){var m={},n=0;for(var i=0;i<EV.length;i++){var e=EV[i];if(inRange(e.dt,a,b)&&f(e)&&!m[e.v]){m[e.v]=1;n++}}return n}
function sum(f,a,b,k){var n=0;for(var i=0;i<EV.length;i++){var e=EV[i];if(inRange(e.dt,a,b)&&f(e))n+=e[k]||0}return n}
function win(){var t=today();return{a:addDays(t,-(R-1)),b:t,pa:addDays(t,-(2*R-1)),pb:addDays(t,-R)}}
function dailyCounts(f,days){var m={};days.forEach(function(d){m[d]=0});EV.forEach(function(e){if(m[e.dt]!==undefined&&f(e))m[e.dt]++});return days.map(function(d){return m[d]})}
function fmt(n){return (Math.round(n*10)/10).toLocaleString('en-US')}
function delta(c,p){if(!c&&!p)return '<span class="flat">no change</span>';if(!p)return '<span class="up">new: was 0</span>';var d=(c-p)/p*100;if(Math.abs(d)<5)return '<span class="flat">about the same as before</span>';return '<span class="'+(d>0?'up':'down')+'">'+(d>0?'▲ ':'▼ ')+Math.abs(Math.round(d))+'% vs the '+R+' days before</span>'}

/* ---------- tiny charts ---------- */
var tip=$('tip');
function showTip(x,y,t){tip.textContent=t;tip.style.display='block';var w=tip.offsetWidth;tip.style.left=Math.max(6,Math.min(innerWidth-w-6,x-w/2))+'px';tip.style.top=Math.max(6,y-44)+'px'}
function hideTip(){tip.style.display='none'}
function bars(labels,vals,tipf,xl){
  var W=640,H=190,pl=36,pb=26,pt=12,n=vals.length,max=Math.max(1,Math.max.apply(null,vals)),top=Math.ceil(max/ (max>8?4:1))*(max>8?4:1)||1;
  var step=(W-pl)/n,bw=Math.max(2,step-3),h=H-pb-pt,o='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bar chart">';
  [0,.5,1].forEach(function(f){var y=pt+h*(1-f);o+='<line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+fmt(top*f)+'</text>'});
  vals.forEach(function(v,i){var bh=v/top*h,x=pl+i*step+(step-bw)/2,y=pt+h-bh;
    if(v>0)o+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="var(--s1)"/>';
    o+='<rect class="hit" data-i="'+i+'" x="'+(pl+i*step)+'" y="'+pt+'" width="'+step+'" height="'+(h+pb)+'" fill="transparent"/>'});
  (xl||[0,Math.floor((n-1)/2),n-1]).forEach(function(i){o+='<text x="'+(pl+i*step+step/2)+'" y="'+(H-6)+'" text-anchor="middle">'+labels[i]+'</text>'});
  return o+'</svg>'
}
function wireBars(host,tipf){Array.prototype.forEach.call(host.querySelectorAll('.hit'),function(r){
  function on(ev){var b=r.getBoundingClientRect();showTip(b.left+b.width/2,b.top+40,tipf(+r.dataset.i))}
  r.addEventListener('pointerenter',on);r.addEventListener('pointerdown',on);r.addEventListener('pointerleave',hideTip)})}
function hbars(rows,suffix){var max=Math.max.apply(null,rows.map(function(r){return r[1]}).concat([1])),o='<div class="bars">';
  rows.forEach(function(r){o+='<div class="r"><span>'+r[0]+'</span><span class="t"><i style="width:'+(r[1]/max*100)+'%"></i></span><span class="v">'+fmt(r[1])+(suffix||'')+'</span></div>'});return o+'</div>'}
function table(head,rows){var o='<div class="scroll"><table><tr>'+head.map(function(h,i){return '<th'+(i?' class="num"':'')+'>'+h+'</th>'}).join('')+'</tr>';
  rows.forEach(function(r){o+='<tr>'+r.map(function(c,i){return '<td'+(i?' class="num"':'')+'>'+c+'</td>'}).join('')+'</tr>'});return o+'</table></div>'}

/* ---------- Momentum ---------- */
var PTS={pv:1,p60:2,sh:3,wc:3};
function points(e){if(e.t==='pv')return e.s==='share'?3:1;if(e.t==='man'&&/^mg-/.test(e.g))return 20;return PTS[e.t]||0}
function momentum(filter,a,b){var p=0,n=0;EV.forEach(function(e){if(inRange(e.dt,a,b)&&filter(e)){var q=points(e);if(q){p+=q;n++}}});return{p:p,n:n}}

/* ---------- views ---------- */
function vOverview(){
  var w=win(),days=dayList(w.b,R),o='';
  o+='<div class="grid">';
  CARDS.forEach(function(k){var c=count(M[k].f,w.a,w.b),p=count(M[k].f,w.pa,w.pb);o+='<div class="stat"><div class="n">'+fmt(c)+'</div><div class="l">'+M[k].n+'</div><div class="d">'+delta(c,p)+'</div></div>'});
  o+='</div>';
  // new vs returning
  var vis=uniq(is('pv'),w.a,w.b),newv=uniq(function(e){return e.t==='pv'&&e.n===1},w.a,w.b),retv=Math.max(0,vis-newv);
  o+='<div class="card"><h2>New and returning visitors</h2><p class="sub">'+fmt(vis)+' different phones or browsers in the last '+R+' days.</p>';
  o+= vis?'<div class="split" role="img" aria-label="'+newv+' new, '+retv+' returning"><i style="flex:'+Math.max(newv,0.001)+';background:var(--s1)"></i><i style="flex:'+Math.max(retv,0.001)+';background:var(--s2)"></i></div><div class="legend"><span><b style="background:var(--s1)"></b>New: '+newv+'</span><span><b style="background:var(--s2)"></b>Came back: '+retv+'</span></div>':'<p class="note">No visits yet in this range.</p>';
  o+='</div>';
  // daily charts
  [['visits','Visits per day','visits'],['plays','Plays per day','plays']].forEach(function(c,ci){
    var vals=dailyCounts(M[c[0]].f,days);
    o+='<div class="card"><h2>'+c[1]+'</h2><div id="ch'+ci+'">'+bars(days.map(short),vals)+'</div><details><summary>Show as a table</summary>'+table(['Day','Count'],days.map(function(d,i){return [long(d),vals[i]]}).reverse())+'</details></div>'});
  // funnel
  var f=[['Opened the page',uniq(is('pv'),w.a,w.b)],['Pressed play',uniq(is('ps'),w.a,w.b)],['Listened 60 seconds',uniq(is('p60'),w.a,w.b)],['Finished an episode',uniq(is('p100'),w.a,w.b)],['Went to our website',uniq(is('wc'),w.a,w.b)]];
  o+='<div class="card"><h2>What visitors did</h2><p class="sub">Different visitors at each step.</p>'+hbars(f)+'</div>';
  // when
  var hrs=[];for(var h=0;h<24;h++)hrs.push(0);EV.forEach(function(e){if(inRange(e.dt,w.a,w.b)&&e.t==='pv')hrs[e.h|0]++});
  o+='<div class="card"><h2>Time of day (Pacific)</h2><div id="chh">'+bars(hrs.map(function(_,i){return (i%12||12)+(i<12?'a':'p')}),hrs,null,[0,6,12,18,23])+'</div></div>';
  // devices
  var dv={},md={},rf={};EV.forEach(function(e){if(inRange(e.dt,w.a,w.b)&&e.t==='pv'){dv[e.d]=(dv[e.d]||0)+1;md[e.m]=(md[e.m]||0)+1;rf[e.r]=(rf[e.r]||0)+1}});
  function rows(m,N){return Object.keys(m).sort(function(a,b){return m[b]-m[a]}).map(function(k){return [N[k]||k,m[k]]})}
  o+='<div class="card"><h2>Devices and where they clicked from</h2><h3 style="font-size:16px;margin:8px 0 2px">Device</h3>'+hbars(rows(dv,DEVN))+'<h3 style="font-size:16px;margin:12px 0 2px">App or browser</h3>'+hbars(rows(md,{app:'Home-screen app',web:'Browser'}))+'<h3 style="font-size:16px;margin:12px 0 2px">Came from site</h3>'+hbars(rows(rf,REFN))+'</div>';
  return o;
}
function srcStats(a,b){
  var m={};function g1(k){return m[k]||(m[k]={s:k,v:0,pl:0,p60:0,sh:0,wc:0,mg:0,pts:0,pe:0,ev:0})}
  EV.forEach(function(e){if(!inRange(e.dt,a,b))return;var k=e.s;
    if(e.t==='man'){if(/^mg-/.test(e.g))g1('mg-'+e.g.slice(3)).mg++;return}
